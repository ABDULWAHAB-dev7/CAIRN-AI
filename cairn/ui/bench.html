<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cairn Bench</title>
<style>
  :root{--bg:#0b1016;--panel:#111821;--line:#1f2a37;--ink:#e2e8f0;--dim:#8a99ad;--teal:#2dd4bf;--blue:#60a5fa;--amber:#fbbf24;--red:#f87171;--redbg:#3a1518}
  *{box-sizing:border-box}html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,"Segoe UI",sans-serif;display:grid;
    grid-template-columns:236px minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 210px auto;
    grid-template-areas:"top top top" "left feed feed" "left step tl" "voice voice voice";gap:8px;padding:8px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:0}
  h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 8px;font-weight:600}
  button{font:inherit;color:var(--ink);background:#172230;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
  button:hover{border-color:var(--teal)}button.primary{background:#0f766e;border-color:#0f766e}button.danger{background:#7f1d1d;border-color:#7f1d1d}
  input,select{font:inherit;color:var(--ink);background:#0b1016;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
  /* top strip */
  #top{grid-area:top;display:flex;gap:28px;align-items:center;padding:8px 14px;flex-wrap:wrap}
  .stat .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}.stat .l{font-size:10px;letter-spacing:.14em;color:var(--dim)}
  #st-state{font-size:20px;text-transform:lowercase}.bad{color:var(--red)}.ok{color:var(--teal)}
  #meta{margin-left:auto;text-align:right;color:var(--dim);font-size:12px;display:flex;gap:10px;align-items:center}
  /* tray map */
  #left{grid-area:left;overflow:auto}
  #wells{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
  .well{aspect-ratio:1;border:1px solid var(--line);border-radius:4px;font-size:9px;color:var(--dim);padding:2px;position:relative}
  .well.filled{background:#1b3a4a;border-color:var(--blue);color:var(--ink)}
  .well.spare{opacity:.45}
  .well.pulse{animation:pulse 1s ease-out 1;border-color:var(--amber);box-shadow:0 0 0 2px var(--amber)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(251,191,36,.9)}100%{box-shadow:0 0 0 12px rgba(251,191,36,0)}}
  .legend{font-size:11px;color:var(--dim);margin-top:8px}
  #parts-out{margin-top:10px;font-size:12px;color:var(--dim)}
  /* feed */
  #feedwrap{grid-area:feed;position:relative;overflow:hidden;padding:0;background:#000;display:flex;align-items:center;justify-content:center}
  #feed,#cam{max-width:100%;max-height:100%;display:block}
  #cam{display:none}#ov{position:absolute;pointer-events:none;display:none}
  #banner{position:absolute;left:10px;right:10px;top:10px;padding:8px 12px;border-radius:6px;background:rgba(58,21,24,.94);border:1px solid var(--red);display:none;font-size:14px}
  #banner.warn{background:rgba(60,45,10,.94);border-color:var(--amber)}
  #banner .acts{margin-top:6px;display:flex;gap:6px}
  #review{position:absolute;left:10px;bottom:10px;background:rgba(15,118,110,.95);padding:6px 10px;border-radius:6px;display:none}
  /* step card */
  #step{grid-area:step;display:flex;flex-direction:column;justify-content:center}
  #step.red{background:var(--redbg);border-color:var(--red)}
  #step .a{font-size:22px;font-weight:700}#step .w{color:var(--dim);margin-top:4px}#step.red .w{color:#fecaca}
  #step .stop{color:var(--red);font-weight:700;margin-bottom:6px}
  /* timeline */
  #tl{grid-area:tl;display:flex;flex-direction:column}
  #tlist{overflow:auto;flex:1;font-size:12.5px}
  .ev{display:flex;gap:8px;padding:4px 6px;border-bottom:1px solid var(--line);cursor:pointer}
  .ev:hover{background:#172230}.ev.sel{background:#0f3a37}.ev .t{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .ev.exception .x{color:var(--red)}.ev.resolved .x{color:var(--teal)}.ev.lost .x{color:var(--amber)}.ev.warn .x{color:var(--amber)}
  /* voice */
  #voice{grid-area:voice;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  #mic{min-width:120px}#mic.live{background:#7f1d1d;border-color:var(--red)}
  #say{flex:1;min-width:180px}#reply{flex:2;min-width:220px;color:var(--teal)}
  details{font-size:12px;color:var(--dim)}details[open]{width:100%}.manual{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  /* modal */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:10}
  #modal .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;width:min(520px,92vw);max-height:90vh;overflow:auto}
  #modal label{display:block;margin:10px 0 3px;color:var(--dim);font-size:12px}#modal input,#modal select,#modal textarea{width:100%}
  textarea{font:inherit;color:var(--ink);background:#0b1016;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
  .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.reasons li{color:var(--red);margin:3px 0}
  @media(max-width:900px){html,body{height:auto}body{grid-template-columns:1fr;grid-template-rows:none;grid-template-areas:"top" "feed" "step" "left" "tl" "voice"}#feedwrap{min-height:300px}#step{min-height:110px}#tl{height:240px}#left{overflow:visible}}
</style>
</head>
<body>
<div id="top" class="panel">
  <div class="stat"><div class="n" id="st-removed">0</div><div class="l">REMOVED</div></div>
  <div class="stat"><div class="n" id="st-acc">0</div><div class="l">ACCOUNTED</div></div>
  <div class="stat"><div class="n" id="st-miss">0</div><div class="l">MISSING</div></div>
  <div class="stat"><div class="n" id="st-state">sealed</div><div class="l">STATE</div></div>
  <div id="meta"><span id="who"></span><button id="btn-cam">Camera</button><button id="btn-base" style="display:none">Baseline</button>
    <button id="btn-sound" title="Spoken alerts">Sound on</button><button id="btn-close" class="primary">Close job</button><button id="btn-new">Jobs</button></div>
</div>
<div id="left" class="panel"><h2>Tray</h2><div id="wells"></div>
  <div class="legend">Filled = a removed part is in that well. The correct well pulses once when a part is misplaced.</div>
  <div id="parts-out"></div></div>
<div id="feedwrap" class="panel">
  <img id="feed" alt="Bench feed"><video id="cam" playsinline muted></video><canvas id="ov"></canvas>
  <div id="banner"></div><div id="review"></div>
</div>
<div id="step" class="panel"><h2>Next step</h2><div id="stepbody"></div></div>
<div id="tl" class="panel"><h2>Timeline</h2><div id="tlist"></div></div>
<div id="voice" class="panel">
  <button id="mic">Hold to talk</button><label style="color:var(--dim)"><input type="checkbox" id="open"> open mic</label>
  <input id="say" placeholder='Say or type: "what&#39;s next?"'><div id="reply"></div>
  <details><summary>Manual input (no camera)</summary><div class="manual" id="manual"></div></details>
</div>
<div id="modal" style="display:none"><div class="card" id="mcard"></div></div>

<script>
const $ = id => document.getElementById(id);
let sid = localStorage.getItem('cairn.sid') || null, token = localStorage.getItem('cairn.token') || '';
let review = null, lastSnap = null, tlCount = -1, seenAlert = '', pulseWell = null, pulseUntil = 0, sound = true;
let camStream = null, camOn = false, canSend = true;

/* ---------- api ---------- */
async function api(path, opts = {}, raw = false) {
  const headers = {...(opts.headers || {})};
  if (token) headers.Authorization = 'Bearer ' + token;
  if (opts.json !== undefined) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.json); }
  const r = await fetch(path, {...opts, headers});
  if (r.status === 401) { token = prompt('API token for this Cairn server:') || ''; localStorage.setItem('cairn.token', token); return api(path, opts, raw); }
  if (raw) return r;
  const body = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(JSON.stringify(body.detail || body)); e.status = r.status; e.detail = body.detail; throw e; }
  return body;
}
async function setImage(el, path) {  // images need the bearer header too, so fetch -> blob
  const r = await api(path, {}, true); if (!r.ok) return;
  const url = URL.createObjectURL(await r.blob()); const old = el.src; el.src = url; if (old.startsWith('blob:')) URL.revokeObjectURL(old);
}

/* ---------- rendering ---------- */
const hhmmss = ts => new Date(ts * 1000).toLocaleTimeString([], {hour12: false});
function render(s, alerts) {
  lastSnap = s;
  const t = s.top;
  $('st-removed').textContent = t.removed; $('st-acc').textContent = t.accounted;
  const m = $('st-miss'); m.textContent = t.missing; m.className = 'n ' + (t.missing ? 'bad' : '');
  $('st-state').textContent = t.state;
  $('who').textContent = (s.job_number ? 'Job ' + s.job_number + ' · ' : '') + (s.closed ? s.closed.replace('_', ' ') : '');
  // tray map
  const pulsing = Date.now() < pulseUntil ? pulseWell : null;
  $('wells').innerHTML = '';
  for (const w of s.wells) {
    const d = document.createElement('div');
    d.className = 'well' + (w.filled ? ' filled' : '') + (w.tray ? '' : ' spare') + (pulsing === w.n ? ' pulse' : '');
    d.title = w.part ? `${w.part} · ${w.cls}` : (w.cls ? `well ${w.n}: ${w.cls}` : 'spare well');
    d.textContent = String(w.n).padStart(2, '0') + (w.part ? '\n' + w.part : '');
    d.style.whiteSpace = 'pre';
    $('wells').appendChild(d);
  }
  const out = Object.values(s.parts).filter(p => p.state === 'lost' || p.state === 'in_transit').map(p => `${p.code} ${p.state.replace('_', ' ')}`);
  $('parts-out').textContent = out.length ? 'Not in a tray: ' + out.join(', ') : '';
  // next step card
  const open = s.exceptions.filter(x => !x.resolved);
  const safety = open.find(x => x.type === 'safety_violation' || x.type === 'hazard');
  const card = $('step'), body = $('stepbody'); body.innerHTML = '';
  card.className = 'panel' + (safety ? ' red' : '');
  const add = (cls, text) => { const d = document.createElement('div'); d.className = cls; d.textContent = text; body.appendChild(d); };
  if (safety) add('stop', safety.type === 'hazard' ? 'Stop all work. ' + safety.detail : 'Stop. ' + safety.detail.replace(/^[a-z_0-9]+: /, ''));
  if (s.closed) add('a', s.closed === 'verified' ? 'Job closed: verified' : 'Job closed with exceptions');
  else if (s.next) { add('a', s.next.action); add('w', s.next.why); }
  else add('a', 'Run the boot test, then close the job.');
  // banner: the most serious open exception
  const b = $('banner'); const top = open.sort((a, b2) => (b2.severity === 'critical') - (a.severity === 'critical') || b2.ts - a.ts)[0];
  if (top && review === null) {
    b.style.display = 'block'; b.className = top.severity === 'critical' ? '' : 'warn'; b.innerHTML = '';
    const msg = document.createElement('div'); msg.textContent = top.detail; b.appendChild(msg);
    const acts = document.createElement('div'); acts.className = 'acts';
    const ack = document.createElement('button'); ack.textContent = 'Acknowledge'; ack.onclick = () => resolveExc(top.id); acts.appendChild(ack);
    if (top.type === 'missing_part' && top.part_id) { const r = document.createElement('button'); r.textContent = 'Retire part (cannot find)'; r.onclick = () => retire(top.part_id); acts.appendChild(r); }
    b.appendChild(acts);
  } else b.style.display = 'none';
  // alerts -> pulse + voice
  for (const a of (alerts || [])) {
    const key = a.ts + a.message; if (key <= seenAlert) continue; seenAlert = key;
    if (a.well) { pulseWell = a.well; pulseUntil = Date.now() + 2500; }
    if (a.severity !== 'info') speak(a.message);
  }
  buildManual(s);
  if (camOn) drawOverlay(s);
}
function renderTimeline(entries, selSeq) {
  const el = $('tlist'); const stick = el.scrollTop + el.clientHeight >= el.scrollHeight - 30; el.innerHTML = '';
  for (const e of entries) {
    const d = document.createElement('div'); d.className = `ev ${e.kind} ${e.severity}` + (e.seq === selSeq ? ' sel' : '');
    d.innerHTML = '<span class="t"></span><span class="x"></span>'; d.children[0].textContent = hhmmss(e.ts); d.children[1].textContent = e.text;
    d.onclick = () => openReview(e.seq); el.appendChild(d);
  }
  if (stick || review === null) el.scrollTop = el.scrollHeight;
}

/* ---------- polling ---------- */
async function poll() {
  if (!sid || review !== null) return;
  try {
    const d = await api(`/sessions/${sid}`);
    render(d.snapshot, d.recent_alerts);
    if (!camOn) { const w = Date.now() < pulseUntil ? `?well=${pulseWell}&` : '?'; await setImage($('feed'), `/sessions/${sid}/frames/latest.png${w}t=${Date.now()}`); }
    if (d.snapshot.events !== tlCount) { tlCount = d.snapshot.events; const t = await api(`/sessions/${sid}/timeline`); renderTimeline(t.entries); }
  } catch (e) { if (e.status === 404 && /session/.test(String(e.message))) { sid = null; localStorage.removeItem('cairn.sid'); showJobs(); } }
}
setInterval(poll, 800);

/* ---------- review any moment ---------- */
async function openReview(seq) {
  review = seq;
  const d = await api(`/sessions/${sid}/at/${seq}`);
  render(d.snapshot, []); $('banner').style.display = 'none';
  if (d.frame_id) await setImage($('feed'), `/sessions/${sid}/frames/${encodeURIComponent(d.frame_id)}.png`);
  $('feed').style.display = 'block'; $('cam').style.display = 'none'; $('ov').style.display = 'none';
  const r = $('review'); r.style.display = 'block'; r.innerHTML = `Reviewing event #${seq} at ${hhmmss(d.ts)} &nbsp;`;
  const back = document.createElement('button'); back.textContent = 'Back to live'; back.onclick = backToLive; r.appendChild(back);
  const t = await api(`/sessions/${sid}/timeline`); renderTimeline(t.entries, seq);
}
function backToLive() { review = null; $('review').style.display = 'none'; if (camOn) { $('feed').style.display = 'none'; $('cam').style.display = 'block'; $('ov').style.display = 'block'; } tlCount = -1; poll(); }
let playing = false;
async function playAll() {
  const t = await api(`/sessions/${sid}/timeline`); playing = true;
  for (const e of t.entries) { if (!playing) break; await openReview(e.seq); await new Promise(r => setTimeout(r, 450)); }
  playing = false;
}

/* ---------- voice ---------- */
function speak(text) { if (!sound || !('speechSynthesis' in window)) return; speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(text)); }
$('btn-sound').onclick = () => { sound = !sound; $('btn-sound').textContent = sound ? 'Sound on' : 'Sound off'; if (!sound) speechSynthesis.cancel(); };
async function say(text) {
  if (!sid || !text.trim()) return; $('say').value = '';
  const u = text.toLowerCase(); const ts = null;
  try {   // events the camera cannot see are logged by voice
    if (/\besd\b/.test(u)) await post('steps', {step_id: 't01'});
    else if (/battery.*(reconnect|back in|plugged in)/.test(u)) await post('steps', {step_id: 'r_t04'});
    else if (/battery.*(disconnect|unplug|out)/.test(u)) await post('steps', {step_id: 't04'});
    else if (/boot.*(pass|ok|work)/.test(u)) await post('boot-test', {passed: true});
    else if (/(swell|smoke|hot|burning)/.test(u)) await post('hazard', {kind: /swell/.test(u) ? 'swelling' : /smoke/.test(u) ? 'smoke' : 'heat'});
  } catch (e) {}
  const r = await post('ask', {utterance: text});
  $('reply').textContent = r.text; speak(r.text); poll();
}
const post = (p, json) => api(`/sessions/${sid}/${p}`, {method: 'POST', json});
$('say').addEventListener('keydown', e => { if (e.key === 'Enter') say(e.target.value); });
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function startRec(continuous) {
  if (!SR) { $('reply').textContent = 'Voice input needs a Chromium browser. Type instead.'; return; }
  rec = new SR(); rec.continuous = continuous; rec.interimResults = false; rec.lang = 'en-US';
  rec.onresult = ev => { for (let i = ev.resultIndex; i < ev.results.length; i++) if (ev.results[i].isFinal) say(ev.results[i][0].transcript); };
  rec.onend = () => { $('mic').classList.remove('live'); if ($('open').checked) startRec(true); };
  rec.start(); $('mic').classList.add('live');
}
$('mic').onpointerdown = () => { if (!$('open').checked) startRec(false); };
$('mic').onpointerup = () => { if (rec && !$('open').checked) rec.stop(); };
$('open').onchange = e => { if (e.target.checked) startRec(true); else if (rec) rec.stop(); };
addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') { e.preventDefault(); if (!$('open').checked) startRec(false); } });
addEventListener('keyup', e => { if (e.code === 'Space' && rec && !$('open').checked) rec.stop(); });

/* ---------- manual input fallback ---------- */
function buildManual(s) {
  const m = $('manual'); if (m.dataset.built) return; m.dataset.built = '1';
  const btn = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; m.appendChild(b); };
  btn('ESD strap on', () => post('steps', {step_id: 't01'}).then(poll));
  btn('Battery disconnected', () => post('steps', {step_id: 't04'}).then(poll));
  btn('Battery reconnected', () => post('steps', {step_id: 'r_t04'}).then(poll));
  btn('Boot test passed', () => post('boot-test', {passed: true}).then(poll));
  btn('Report swelling', () => post('hazard', {kind: 'swelling'}).then(poll));
  const ps = document.createElement('select'), zs = document.createElement('select');
  for (const [id, p] of Object.entries(s.parts)) ps.add(new Option(`${p.code} ${p.label}`, id));
  for (const z of ['hand', 'device', 'bench']) zs.add(new Option(z, z));
  for (const w of s.wells.filter(x => x.tray)) zs.add(new Option('well ' + String(w.n).padStart(2, '0'), 'well:' + w.n + ':' + w.tray));
  m.append(ps, zs);
  btn('Move part', async () => {
    let zone = zs.value, well = null; if (zone.startsWith('well:')) { const [, n, tray] = zone.split(':'); zone = tray; well = +n; }
    const r = await post('taps', {part_id: ps.value, zone, well}); r.alerts.forEach(a => { $('reply').textContent = a.message; speak(a.message); }); poll();
  });
}
async function resolveExc(id) { const note = prompt('Technician note (kept on the passport):'); if (!note) return; await post(`exceptions/${id}/resolve`, {note}); poll(); }
async function retire(pid) { const reason = prompt('Why is it being retired (e.g. lost, replaced)?'); if (!reason) return; await post(`parts/${pid}/retire`, {reason}); poll(); }

/* ---------- camera ---------- */
const prev = {px: null, sent: 0};
async function toggleCam() {
  if (camOn) { camStream.getTracks().forEach(t => t.stop()); camOn = false; $('cam').style.display = 'none'; $('ov').style.display = 'none'; $('feed').style.display = 'block'; $('btn-base').style.display = 'none'; return; }
  try { camStream = await navigator.mediaDevices.getUserMedia({video: {width: 1280, height: 720}, audio: false}); }
  catch (e) { alert('Camera unavailable: ' + e.message); return; }
  const v = $('cam'); v.srcObject = camStream; await v.play(); camOn = true;
  $('feed').style.display = 'none'; v.style.display = 'block'; $('ov').style.display = 'block'; $('btn-base').style.display = '';
  capLoop();
}
function frameBlob(quality = .8) {
  const v = $('cam'), c = document.createElement('canvas'); c.width = 960; c.height = 600; c.getContext('2d').drawImage(v, 0, 0, 960, 600);
  return new Promise(r => c.toBlob(r, 'image/jpeg', quality));
}
async function capLoop() {  // event-driven: send a frame only when the scene changed (or every 4 s)
  const c = document.createElement('canvas'); c.width = 64; c.height = 40; const g = c.getContext('2d', {willReadFrequently: true});
  while (camOn) {
    await new Promise(r => setTimeout(r, 350));
    if (review !== null || !canSend || !sid) continue;
    g.drawImage($('cam'), 0, 0, 64, 40); const px = g.getImageData(0, 0, 64, 40).data; let diff = 0;
    if (prev.px) for (let i = 0; i < px.length; i += 4) diff += Math.abs(px[i] - prev.px[i]);
    const changed = !prev.px || diff / (64 * 40) > 3; prev.px = px;
    if (!changed && Date.now() - prev.sent < 4000) continue;
    prev.sent = Date.now();
    try { const r = await api(`/sessions/${sid}/image`, {method: 'POST', body: await frameBlob(), headers: {'Content-Type': 'image/jpeg'}}, true);
      if (r.status === 503) { canSend = false; $('reply').textContent = 'Camera preview only: the server has no perception backend (set CAIRN_PERCEPTION=sam).'; }
      else if (r.status === 502) $('reply').textContent = 'Perception call failed; check the SAM key and network.';
      else if (r.ok) { const d = await r.json(); (d.alerts || []).forEach(a => { if (a.well) { pulseWell = a.well; pulseUntil = Date.now() + 2500; } if (a.severity !== 'info') speak(a.message); }); }
    } catch (e) {}
  }
}
function drawOverlay(s) {
  const v = $('cam'), ov = $('ov'); if (!v.videoWidth) return;
  const r = v.getBoundingClientRect(), wr = $('feedwrap').getBoundingClientRect();
  ov.style.left = (r.left - wr.left) + 'px'; ov.style.top = (r.top - wr.top) + 'px'; ov.width = r.width; ov.height = r.height;
  const k = r.width / 960, g = ov.getContext('2d'); g.clearRect(0, 0, ov.width, ov.height); g.lineWidth = 1; g.font = '10px system-ui';
  for (const p of Object.values(s.parts)) {
    if (!p.box || p.state === 'installed' && p.location === 'device' && p.class === 'fastener' && false) continue;
    const col = p.state === 'lost' ? '#f87171' : p.location === 'hand' ? '#fbbf24' : p.location.startsWith('tray') ? '#60a5fa' : '#2dd4bf';
    g.strokeStyle = col; g.fillStyle = col; const [x0, y0, x1, y1] = p.box.map(n => n * k); g.strokeRect(x0, y0, x1 - x0, y1 - y0);
    const where = p.location.startsWith('tray') && p.well ? 'tray ' + String(p.well).padStart(2, '0') : p.location.replace('_', ' ');
    g.fillText((x1 - x0) > 20 * k || p.location === 'hand' ? `${p.code} · ${p.label} · ${where}` : p.code, x0, Math.max(9, y0 - 3));
  }
}
$('btn-cam').onclick = toggleCam;
$('btn-base').onclick = async () => { const r = await api(`/sessions/${sid}/baseline`, {method: 'POST', body: await frameBlob(.9), headers: {'Content-Type': 'image/jpeg'}}, true); $('reply').textContent = r.ok ? 'Baseline of the sealed device saved.' : 'Baseline failed.'; };

/* ---------- close job ---------- */
function modal(html) { $('mcard').innerHTML = html; $('modal').style.display = 'flex'; }
const hide = () => $('modal').style.display = 'none';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
$('btn-close').onclick = () => closeJob(false);
async function closeJob(accept, note) {
  if (!sid) return;
  try {
    const p = await api(`/sessions/${sid}/close`, {method: 'POST', json: {accept_exceptions: !!accept, note}});
    const b = p.body; modal(`<h2>Job closed</h2><div style="font-size:26px;font-weight:800;color:${b.status === 'VERIFIED' ? '#2dd4bf' : '#fbbf24'}">${esc(b.status)}</div>
      <p>${b.counts.fasteners_accounted}/${b.counts.fasteners_total} fasteners, ${b.counts.extra_parts} extra parts, ${b.exceptions.length} exceptions recorded.</p>
      <div class="row"><button class="primary" onclick="dl('passport.pdf')">Passport PDF</button><button onclick="dl('passport.html')">HTML</button><button onclick="dl('passport')">JSON</button><button onclick="hide()">Done</button></div>`);
    poll();
  } catch (e) {
    const d = e.detail || {}; const reasons = d.reasons || [e.message];
    if (e.status !== 409) return modal(`<h2>Could not close</h2><p>${esc(e.message)}</p><div class="row"><button onclick="hide()">OK</button></div>`);
    modal(`<h2>Close blocked</h2><p>The verifier found problems the passport cannot hide:</p><ul class="reasons">${reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
      <label>To close anyway, write what you are accepting. The passport will say CLOSED WITH EXCEPTIONS.</label><textarea id="cnote" rows="3"></textarea>
      <div class="row"><button class="danger" onclick="closeJob(true, document.getElementById('cnote').value)">Close with exceptions</button><button onclick="hide()">Keep working</button></div>`);
  }
}
async function dl(kind) {
  const ext = kind === 'passport' ? 'json' : kind.split('.')[1]; const r = await api(`/sessions/${sid}/${kind}`, {}, true);
  const blob = await r.blob(); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `cairn-passport.${ext}`; a.click();
  if (ext === 'html' || ext === 'pdf') window.open(a.href, '_blank');
}

/* ---------- jobs ---------- */
$('btn-new').onclick = showJobs;
async function showJobs() {
  let list = []; try { list = (await api('/sessions')).sessions; } catch (e) {}
  let devices = ['demo_laptop']; try { devices = (await api('/devices')).devices; } catch (e) {}
  modal(`<h2>New job</h2>
    <label>Device</label><select id="j-dev">${devices.map(d => `<option>${esc(d)}</option>`).join('')}</select>
    <label>Job number</label><input id="j-num" placeholder="J-1042">
    <label>Technician</label><input id="j-tech" value="${esc(localStorage.getItem('cairn.tech') || '')}" placeholder="Your name">
    <label>Bench</label><input id="j-bench" value="bench_01">
    <div class="row"><button class="primary" onclick="newJob()">Start job (snapshot the sealed device)</button></div>
    <h2 style="margin-top:22px">Resume</h2>${list.length ? list.map(s => `<div class="row" style="margin:4px 0"><button onclick="resume('${s.id}')">${esc(s.job_number || s.id)} · ${esc(s.phase.toLowerCase())}${s.closed ? ' · ' + esc(s.closed) : ''}</button></div>`).join('') : '<p style="color:var(--dim)">No jobs yet.</p>'}
    <h2 style="margin-top:22px">No bench handy?</h2><div class="row"><button onclick="runDemo()">Replay the scripted demo</button></div>`);
}
async function newJob() {
  const tech = $('j-tech').value.trim(); if (!tech) { $('j-tech').focus(); return; }
  localStorage.setItem('cairn.tech', tech);
  const d = await api('/sessions', {method: 'POST', json: {technician: tech, bench: $('j-bench').value || 'bench_01', device: $('j-dev').value, job_number: $('j-num').value || null}});
  resume(d.id);
}
function resume(id) { sid = id; localStorage.setItem('cairn.sid', id); review = null; tlCount = -1; seenAlert = ''; hide(); $('review').style.display = 'none'; poll(); }
async function runDemo() {
  modal('<p>Running the scripted demo&hellip;</p>'); const d = await api('/demo', {method: 'POST'}); resume(d.id);
  const t = await api(`/sessions/${sid}/timeline`); renderTimeline(t.entries);
  modal(`<h2>Demo job ready</h2><p>A teardown with a skipped battery step, a dropped screw, a wrong screw, a 30-minute break, and a reassembly. Click any timeline entry to see that moment, or play it through.</p>
    <div class="row"><button class="primary" onclick="hide();playAll()">Play through</button><button onclick="hide()">Browse it myself</button></div>`);
}
(async () => { if (sid) { try { await api(`/sessions/${sid}`); poll(); return; } catch (e) {} } showJobs(); })();
</script>
