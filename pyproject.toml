[project]
name = "cairn"
version = "0.1.0"
description = "Object permanence for physical work: a persistent, verifiable object graph for repair."
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]
pdf = ["pillow>=10"]

[project.scripts]
cairn = "cairn.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cairn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
